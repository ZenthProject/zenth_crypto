[package]
name = "dilithium"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
hex-literal = "1.1.0"
pqcrypto-mldsa = {
    version = "0.1.2",
    default-features = false,
    features = ["std"]
}
pqcrypto-traits = "0.3.5"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"

