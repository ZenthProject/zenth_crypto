[package]
name = "exchange"
version = "0.1.0"
edition = "2024"

[dependencies]
spake2 = "0.4"

utils = { path = "../utils" }
aes_modes = { path = "../symmetric/aes_modes" }
hashing = { path = "../hashing" }

curve25519-dalek = "4.1.3"
displaydoc = "0.2.5"
hkdf = "0.12.4"
hpke-rs-crypto = "0.3.0"
rand = "0.8"
rand_core = { version = "0.9.3", features = ["os_rng"]} 
sha2 = "0.10.9"
subtle = "2.6.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
log = "0.4.28"
derive-where = "1.6.0"
derive_more = { version = "2.0.1", features = ["display", "from"] }
rand_chacha = "0.9.0"
assert_matches = "1.5.0"
const-str = "0.7.0"
serde_json = "1.0.145"
hex = "0.4.3"



